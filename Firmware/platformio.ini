; =====================================================================
; ANTARAGA Smartband — XIAO ESP32-S3 (firmware streaming)
; =====================================================================
[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
; Butuh Arduino core 3.x (ESP-IDF 5.x) karena src/sensors.cpp memakai
; esp_adc/adc_oneshot.h + esp_adc/adc_cali.h — sama seperti program optimasi
; SEN0203-mu. Platform RESMI PlatformIO (espressif32 7.x) masih terkunci di
; framework-arduinoespressif32 ~3.20017 = core 2.0.17 (IDF 4.4), yang TIDAK
; punya header itu. Fork pioarduino di bawah adalah jalur standar untuk core 3.x.
;
; Kalau tag ini tidak bisa diunduh, coba versi lain dari
; https://github.com/pioarduino/platform-espressif32/releases
;   54.03.21 -> Arduino 3.3.x / IDF 5.5
;   53.03.13 -> Arduino 3.1.3 / IDF 5.3.2   (dipakai di bawah)
;   51.03.07 -> Arduino 3.0.7 / IDF 5.1.4
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip

; CATATAN: src/sensors.cpp punya jalur cadangan untuk core 2.x (driver ADC
; legacy). Jadi kalau benar-benar tidak bisa mengunduh fork di atas, ganti
; baris `platform` menjadi `platform = espressif32` dan firmware tetap compile —
; hanya kalibrasi ADC-nya memakai skema lama yang sedikit kurang akurat.

board     = seeed_xiao_esp32s3
framework = arduino

board_build.partitions = default_8MB.csv
board_build.f_cpu      = 240000000L

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

; Sengaja TANPA lib_deps. Driver MAX30102 ditulis langsung di src/sensors.cpp
; supaya laju sampel, SMP_AVE, pulse width, arus LED dan kedalaman FIFO bisa
; dikunci persis seperti hasil optimasimu — library pihak ketiga
; (SparkFun/DFRobot) menyembunyikan parameter-parameter itu.
