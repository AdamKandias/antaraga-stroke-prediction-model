; =====================================================================
; ANTARAGA BPM — XIAO ESP32-S3 (hitung denyut di perangkat, SON1303 saja)
; =====================================================================
; Dua environment:
;   seeed_xiao_esp32s3  -> firmware (default)
;   native              -> uji algoritma di PC, lihat tools/bpm_csv.cpp
[platformio]
default_envs = seeed_xiao_esp32s3

; ---------------------------------------------------------------------
; Firmware
; ---------------------------------------------------------------------
[env:seeed_xiao_esp32s3]
; Sama seperti ../Firmware: butuh Arduino core 3.x (ESP-IDF 5.x) karena
; src/ppg.cpp memakai esp_adc/adc_oneshot.h. Platform RESMI PlatformIO
; (espressif32 7.x) masih terkunci di core 2.0.17 (IDF 4.4) yang tidak punya
; header itu. Fork pioarduino di bawah adalah jalur standar untuk core 3.x.
;
; Kalau tag ini tidak bisa diunduh, coba versi lain dari
; https://github.com/pioarduino/platform-espressif32/releases
;   54.03.21 -> Arduino 3.3.x / IDF 5.5
;   53.03.13 -> Arduino 3.1.3 / IDF 5.3.2   (dipakai di bawah, sama dgn ../Firmware)
;   51.03.07 -> Arduino 3.0.7 / IDF 5.1.4
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip

; CATATAN: src/ppg.cpp punya jalur cadangan untuk core 2.x (driver ADC legacy),
; jadi kalau fork di atas benar-benar tidak bisa diunduh, ganti baris `platform`
; menjadi `platform = espressif32` dan firmware ini tetap compile.

board     = seeed_xiao_esp32s3
framework = arduino

board_build.partitions = default_8MB.csv
board_build.f_cpu      = 240000000L

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

; Tanpa lib_deps: tidak ada library pihak ketiga sama sekali. Seluruh
; pemrosesan sinyal ada di src/bpm.cpp (~350 baris) supaya setiap ambang,
; koefisien filter, dan aturan penolakan bisa dilihat dan disetel.
; tools/ tidak ikut ter-compile di sini (build_src_filter default = src/ saja).

; ---------------------------------------------------------------------
; Uji algoritma di PC — TIDAK ada hubungannya dengan board
; ---------------------------------------------------------------------
; Menjalankan src/bpm.cpp yang SAMA di host, dengan sampel dari sinyal
; sintetis (BPM diketahui) atau dari CSV rekaman recorder-mu.
;
;   pio run -e native -t exec                        # 14 uji regresi
;   .pio/build/native/program rekaman.csv > out.csv  # rekaman nyata
[env:native]
platform = native
build_flags = -std=c++11 -O2 -Wall -Iinclude
; Hanya mesinnya + penguji. src/main.cpp & src/ppg.cpp butuh Arduino.
build_src_filter = +<bpm.cpp> +<../tools/bpm_csv.cpp>
