# Tambahkan file ini ke /etc/nginx/sites-available/antaraga
# lalu: ln -s /etc/nginx/sites-available/antaraga /etc/nginx/sites-enabled/
# lalu: nginx -t && systemctl reload nginx
#
# Catatan SSL: Cloudflare mode = Flexible (browser→HTTPS→CF→HTTP→nginx).
# JANGAN redirect HTTP→HTTPS di sini — itu yang menyebabkan ERR_TOO_MANY_REDIRECTS.

# Root domain: antaraga.web.id → FastAPI homepage
server {
    listen 80;
    server_name antaraga.web.id www.antaraga.web.id;

    # Batas bawaan nginx hanya 1 MB — terlalu kecil untuk unggahan APK
    # (biasanya 20–60 MB) dan firmware .bin lewat dashboard. Tanpa baris ini
    # nginx menolak dengan "413 Request Entity Too Large" sebelum permintaan
    # sempat sampai ke FastAPI, sehingga pesan galatnya berupa halaman HTML
    # nginx, bukan JSON dari aplikasi.
    client_max_body_size 350M;

    location / {
        proxy_pass         http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Unggahan besar butuh waktu lebih lama daripada permintaan biasa
        client_body_timeout 600s;
        proxy_send_timeout  600s;
        proxy_read_timeout  600s;

        # Alirkan langsung ke aplikasi, jangan tunggu seluruh berkas
        # tersalin ke disk nginx lebih dulu
        proxy_request_buffering off;
    }
}

# API subdomain: api.antaraga.web.id → FastAPI (semua endpoint)
server {
    listen 80;
    server_name api.antaraga.web.id;

    client_max_body_size 350M;

    location / {
        proxy_pass         http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (untuk /serial/ws)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        client_body_timeout 600s;
        proxy_send_timeout  600s;
        # Firmware kirim batch tiap 500ms
        proxy_read_timeout  600s;

        proxy_request_buffering off;
    }
}
