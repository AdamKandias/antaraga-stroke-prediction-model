# Tambahkan file ini ke /etc/nginx/sites-available/antaraga
# lalu: ln -s /etc/nginx/sites-available/antaraga /etc/nginx/sites-enabled/
# lalu: certbot --nginx -d api.antaraga.web.id
# lalu: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name api.antaraga.web.id;

    # Certbot akan otomatis redirect ini ke HTTPS setelah certbot dijalankan
    location / {
        proxy_pass         http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (untuk /serial/ws)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Firmware kirim batch tiap 500ms, jangan timeout terlalu cepat
        proxy_read_timeout 60s;
    }
}
