; =====================================================================
; ANTARAGA - Perekam 3 kanal PPG mentah (RED + IR + HIJAU)
; =====================================================================
[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
; src/main.cpp punya jalur cadangan untuk ADC legacy, jadi platform RESMI
; sudah cukup dan tidak perlu fork pioarduino seperti ../Firmware. Kanal
; hijau dikirim sebagai nilai ADC MENTAH, tidak perlu kalibrasi eFuse.
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

monitor_speed   = 921600
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

; GUI tidak ikut di sini - jalankan terpisah:  python gui/plotter.py
; Jangan buka serial monitor PlatformIO bersamaan dengan GUI: satu port
; hanya bisa dipegang satu proses.
